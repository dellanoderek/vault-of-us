<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <script>
      (function() {
        var theme = localStorage.getItem('theme-preference') || 'system';
        var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark-theme');
        var meta = document.createElement('meta');
        meta.name = 'theme-color';
        meta.content = isDark ? '#252220' : '#f4eee8';
        document.head.appendChild(meta);
      })();
    </script>
    <meta name="description" content="Um espaço privado para guardar memórias a dois." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vault of Us" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/Icon-192.png" />
    <link rel="icon" href="/icons/Icon-192.png" />
    <title>Vault of Us</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
